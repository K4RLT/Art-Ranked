name: Rate Artworks (Moondream2)

on:
  schedule:
    # Run every 6 hours automatically (Section 8 spec)
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Number of matches to run'
        required: false
        default: '5'

permissions:
  contents: write

jobs:
  judge_artworks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install transformers einops pillow requests

      - name: Run Moondream2 Seeding
        run: |
          python rate_artworks.py
        env:
          BATCH_MATCHES: ${{ github.event.inputs.batch_size || '5' }}
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}

      - name: Commit and Push Updated Ratings
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ratings.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(ratings): automated Moondream2 Elo update [skip ci]"
            git push
          fi
