name: Rate Artworks (Moondream2)

on:
  schedule:
    # Run every 6 hours automatically (Section 8 spec)
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Number of random matches to run (if custom_mode is false)'
        required: false
        default: '5'
      custom_mode:
        description: 'Run on custom pair? (true / false)'
        required: false
        default: 'false'
      image_a_url:
        description: 'Direct URL of Image A'
        required: false
      image_b_url:
        description: 'Direct URL of Image B'
        required: false
      title_a:
        description: 'Title of Artwork A'
        required: false
        default: 'Custom Artwork A'
      title_b:
        description: 'Title of Artwork B'
        required: false
        default: 'Custom Artwork B'
      criteria:
        description: 'Custom judging criteria'
        required: false
        default: 'composition, anatomy, lighting, color, and visual impact'

permissions:
  contents: write

jobs:
  judge_artworks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Run Moondream2 Seeding & Judging
        run: |
          python -u rate_artworks.py
        env:
          PYTHONUNBUFFERED: "1"
          BATCH_MATCHES: ${{ github.event.inputs.batch_size || '5' }}
          CUSTOM_MODE: ${{ github.event.inputs.custom_mode || 'false' }}
          IMAGE_A_URL: ${{ github.event.inputs.image_a_url }}
          IMAGE_B_URL: ${{ github.event.inputs.image_b_url }}
          TITLE_A: ${{ github.event.inputs.title_a || 'Custom Artwork A' }}
          TITLE_B: ${{ github.event.inputs.title_b || 'Custom Artwork B' }}
          CRITERIA: ${{ github.event.inputs.criteria || 'composition, anatomy, lighting, color, and visual impact' }}
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}

      - name: Commit and Push Updated Ratings
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(ratings): automated Moondream2 Elo update [skip ci]"
            git push origin HEAD:main
          fi
